# brain-checks
# Path guard runs separately. This workflow validates vault structure on every PR.
---
name: brain-checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: hashFiles('scripts/requirements.txt') != ''
        run: pip install -r scripts/requirements.txt

      - name: Run brain audit
        run: python scripts/brain_audit.py --strict --github-output

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-audit-report
          path: brain-audit-report.*
          if-no-files-found: ignore
